collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_raw
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.3
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [PolygonStop]
    PolygonStop:
      type: polygon
      points: [0.25, 0.18, 0.25, -0.18, -0.10, -0.18, -0.10, 0.18]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
