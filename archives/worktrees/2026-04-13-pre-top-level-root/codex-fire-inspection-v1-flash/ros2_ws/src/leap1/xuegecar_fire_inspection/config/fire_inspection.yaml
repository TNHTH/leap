xuegecar_fire_inspection:
  ros__parameters:
    use_sim_time: false

camera_node:
  ros__parameters:
    camera_device: 0
    frame_width: 640
    frame_height: 480
    fps: 15.0
    frame_id: camera_link
    mjpeg_host: 0.0.0.0
    mjpeg_port: 8090
    jpeg_quality: 85
    stream_path: /stream
    image_topic: /camera/image_raw

fire_detector_node:
  ros__parameters:
    image_topic: /camera/image_raw
    fire_detected_topic: /fire_detected
    debug_image_topic: /camera/debug_image
    hsv_lower: [0, 120, 180]
    hsv_upper: [35, 255, 255]
    min_fire_area: 700.0
    required_consecutive_detections: 4
    clear_frames: 6
    center_weight: 0.25
    center_region_ratio: 0.5
    blur_kernel_size: 5
    morphological_kernel_size: 5

mission_manager_node:
  ros__parameters:
    image_topic: /camera/image_raw
    fire_detected_topic: /fire_detected
    inspection_state_topic: /inspection_state
    pump_cmd_topic: /pump_cmd
    cmd_vel_topic: /cmd_vel
    follow_waypoints_action: /follow_waypoints
    robot_frame: base_link
    global_frame: map
    heartbeat_hz: 2.0
    record_fps: 10.0
    record_directory: ~/leap1_fire_recordings
    required_fire_state: true
    spray_duration_sec: 5.0
    cooldown_sec: 8.0
    stop_publish_count: 8
    waypoints_x: [0.5, 1.2, 1.2, 0.5]
    waypoints_y: [0.5, 0.5, 1.2, 1.2]
    waypoints_yaw_deg: [0.0, 90.0, 180.0, -90.0]

pump_guard_node:
  ros__parameters:
    pump_cmd_topic: /pump_cmd
    inspection_state_topic: /inspection_state
    cmd_vel_topic: /cmd_vel
    manager_timeout_sec: 3.0
    guard_publish_period_sec: 0.5
